[project]
name = "djangosige"
version = "1.0.0"
description = "Sistema de Gestão Empresarial"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12, <3.13"

dependencies = [
    "Django==5.2.14",
    "python-decouple==3.8",
    "dj-database-url==3.1.2",
    "django-crispy-forms==2.7",
    "crispy-bootstrap5==2026.3",
    "weasyprint==68.1",
    "PySIGNFe @ https://github.com/thiagopena/PySIGNFe/archive/master.zip#sha256=72c71249846ea61e18324a215f9aa361631acfe17f2923a0309d2a1124dd7c87",
]

[dependency-groups]
dev = [
    "ruff==0.16.5",
    "mypy==2.3.1",
    "django-stubs[compatible-mypy]==6.1.0",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "factory_boy==3.3.3",
    "Sphinx==9.1.0",
    "sphinx-autobuild==2025.8.25",
    "django-debug-toolbar==7.1.1",
    "django-extensions==4.1",
]

[tool.ruff]
line-length = 120

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "**/tests.py", "**/test_*.py"]

[tool.coverage.run]
include = ["djangosige/*"]
omit = ["*/migrations/*", "*/tests/*", "config/*", "docs/*"]
plugins = ["django_coverage_plugin"]
